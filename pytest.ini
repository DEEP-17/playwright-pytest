[pytest]
testpaths = tests
addopts = -ra --strict-markers --html=test-results/report.html --self-contained-html --video=retain-on-failure --screenshot=only-on-failure --tracing=retain-on-failure
markers =
    smoke: critical end-to-end checks
    regression: broader end-to-end regression checks
    critical: critical negative-path end-to-end checks
    all: included in the full test suite
