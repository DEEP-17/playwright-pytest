[pytest]
testpaths = testCases/endToEndTests
python_files = test*.py
python_functions = test*
addopts =
    -ra
    --strict-markers
    --html=testResults/report.html
    --self-contained-html
    --css=automationScripts/reportStyles.css
    --output=testResults/playwrightArtifacts
    --video=retain-on-failure
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --alluredir=testResults/allureResults
    --clean-alluredir
render_collapsed = passed
initial_sort = result
log_cli = true
log_cli_level = INFO
log_file = testResults/pytest.log
log_file_level = DEBUG
markers =
    smoke: critical end-to-end checks
    regression: broader end-to-end regression checks
    critical: critical negative-path end-to-end checks
    all: included in the full test suite
