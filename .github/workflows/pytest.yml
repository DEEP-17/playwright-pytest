name: pytest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Run unit tests
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q
          tests/test_calendar_helper.py
          tests/test_support.py
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-unit-tests
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  session-state-tests:
    name: Browser session-state tests
    runs-on: windows-latest
    needs: unit-tests
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Run browser session-state tests
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_session_state.py
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-session-state
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  flight-ui-tests:
    name: Flight UI tests
    runs-on: windows-latest
    needs: [unit-tests, session-state-tests]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Run flight UI tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_flight.py
      - name: Verify authenticated session-state files
        if: always()
        shell: pwsh
        run: |
          $storageState = Test-Path ".auth\authenticated-state.json"
          $sessionStorage = Test-Path ".auth\authenticated-state.session-storage.json"
          [ordered]@{
            job = "flight-ui-tests"
            storageStateCreated = $storageState
            sessionStorageCreated = $sessionStorage
          } | ConvertTo-Json | Set-Content "test-results\session-state-evidence.json"
          if (-not $storageState -or -not $sessionStorage) {
            throw "Authenticated storage-state files were not created."
          }
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-flight-ui
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  hotel-ui-tests:
    name: Hotel UI tests
    runs-on: windows-latest
    needs: [unit-tests, session-state-tests]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Run hotel UI tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_hotel.py
      - name: Verify authenticated session-state files
        if: always()
        shell: pwsh
        run: |
          $storageState = Test-Path ".auth\authenticated-state.json"
          $sessionStorage = Test-Path ".auth\authenticated-state.session-storage.json"
          [ordered]@{
            job = "hotel-ui-tests"
            storageStateCreated = $storageState
            sessionStorageCreated = $sessionStorage
          } | ConvertTo-Json | Set-Content "test-results\session-state-evidence.json"
          if (-not $storageState -or -not $sessionStorage) {
            throw "Authenticated storage-state files were not created."
          }
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-hotel-ui
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  critical-flow-tests:
    name: Authenticated critical-flow tests
    runs-on: windows-latest
    needs: [unit-tests, session-state-tests]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Run authenticated critical-flow tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q
          tests/test_critical_flows.py
      - name: Verify authenticated session-state files
        if: always()
        shell: pwsh
        run: |
          $storageState = Test-Path ".auth\authenticated-state.json"
          $sessionStorage = Test-Path ".auth\authenticated-state.session-storage.json"
          [ordered]@{
            job = "critical-flow-tests"
            storageStateCreated = $storageState
            sessionStorageCreated = $sessionStorage
          } | ConvertTo-Json | Set-Content "test-results\session-state-evidence.json"
          if (-not $storageState -or -not $sessionStorage) {
            throw "Authenticated storage-state files were not created."
          }
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-critical-flows
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  saved-trip-tests:
    name: Destructive saved-trip test
    runs-on: windows-latest
    needs: [unit-tests, session-state-tests]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Run saved-trip test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_trip.py
      - name: Verify authenticated session-state files
        if: always()
        shell: pwsh
        run: |
          $storageState = Test-Path ".auth\authenticated-state.json"
          $sessionStorage = Test-Path ".auth\authenticated-state.session-storage.json"
          [ordered]@{
            job = "saved-trip-tests"
            storageStateCreated = $storageState
            sessionStorageCreated = $sessionStorage
          } | ConvertTo-Json | Set-Content "test-results\session-state-evidence.json"
          if (-not $storageState -or -not $sessionStorage) {
            throw "Authenticated storage-state files were not created."
          }
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-saved-trip
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  test-reports:
    name: Collect CI test reports
    runs-on: windows-latest
    if: always()
    needs:
      - unit-tests
      - session-state-tests
      - flight-ui-tests
      - hotel-ui-tests
      - critical-flow-tests
      - saved-trip-tests
    steps:
      - name: Download pytest reports and browser artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-report-*
          path: test-reports
      - name: Upload combined CI reports
        uses: actions/upload-artifact@v4
        with:
          name: complete-pytest-reports
          path: test-reports/
          if-no-files-found: warn
          retention-days: 14
