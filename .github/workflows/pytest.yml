name: pytest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  preflight-tests:
    name: Unit and browser session tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "test-results" | Out-Null
      - name: Run unit and browser session tests
        run: >-
          .\.venv\Scripts\python.exe -m pytest -vv -s
          --log-cli-level=DEBUG
          --log-file=test-results/pytest.log
          --log-file-level=DEBUG
          tests/test_calendar_helper.py
          tests/test_support.py
          tests/test_ci_report.py
          tests/test_session_state.py
          tests/test_browser_diagnostics.py
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-preflight
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  flight-tests:
    name: Flight test cases
    runs-on: windows-latest
    needs: preflight-tests
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-ui-tests
        with:
          case-name: Flight scenarios
          case-id: flight-scenarios
          test-paths: tests/test_flight.py tests/test_critical_flows.py
          test-filter: test_e1 or test_e5 or test_e6 or test_e7 or test_e8 or test_e9 or c5 or c6 or (c7 and flight) or c13 or c15 or c21 or c22
          authenticated: "true"
          base-url: ${{ secrets.BASE_URL }}
          user-email: ${{ secrets.USER_EMAIL }}
          user-password: ${{ secrets.USER_PASSWORD }}

  hotel-tests:
    name: Hotel test cases
    runs-on: windows-latest
    needs: preflight-tests
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-ui-tests
        with:
          case-name: Hotel scenarios
          case-id: hotel-scenarios
          test-paths: tests/test_hotel.py tests/test_critical_flows.py
          test-filter: test_e2 or test_e10 or (c7 and hotel) or c8 or c9
          authenticated: "true"
          base-url: ${{ secrets.BASE_URL }}
          user-email: ${{ secrets.USER_EMAIL }}
          user-password: ${{ secrets.USER_PASSWORD }}

  attractions-tests:
    name: Attractions test cases
    runs-on: windows-latest
    needs: preflight-tests
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-ui-tests
        with:
          case-name: Public attractions validation
          case-id: public-attractions
          test-paths: tests/test_critical_flows.py
          test-filter: test_e4 or c10
          authenticated: "false"
          base-url: ${{ secrets.BASE_URL }}

  saved-trip-tests:
    name: Saved-trip scenarios E12-E14
    runs-on: windows-latest
    environment: QA
    needs: [flight-tests, hotel-tests, attractions-tests]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "test-results" | Out-Null
      - name: Validate required test configuration
        shell: pwsh
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:BASE_URL)) {
            $missing += "BASE_URL"
          }
          if ([string]::IsNullOrWhiteSpace($env:USER_EMAIL)) {
            $missing += "USER_EMAIL"
          }
          if ([string]::IsNullOrWhiteSpace($env:USER_PASSWORD)) {
            $missing += "USER_PASSWORD"
          }
          if ($missing.Count -gt 0) {
            throw "Configure these GitHub Actions repository secrets: $($missing -join ', '). Secret values are never printed."
          }
      - name: Run saved-trip scenarios
        id: run-tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: >-
          .\.venv\Scripts\python.exe -m pytest -vv -s
          --log-cli-level=DEBUG
          --log-file=test-results/pytest.log
          --log-file-level=DEBUG
          --junitxml=test-results/junit-saved-trip.xml
          tests/test_trip.py
      - name: Verify authenticated session-state files
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "test-results" | Out-Null
          $storageState = Test-Path ".auth\authenticated-state.json"
          $sessionStorage = Test-Path ".auth\authenticated-state.session-storage.json"
          [ordered]@{
            job = "saved-trip-tests"
            pytestOutcome = "${{ steps.run-tests.outcome }}"
            storageStateCreated = $storageState
            sessionStorageCreated = $sessionStorage
          } | ConvertTo-Json | Set-Content "test-results\session-state-evidence.json"
          if (
            "${{ steps.run-tests.outcome }}" -eq "success" -and
            (-not $storageState -or -not $sessionStorage)
          ) {
            throw "Authenticated storage-state files were not created."
          }
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-saved-trip
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  test-reports:
    name: Collect CI test reports
    runs-on: windows-latest
    if: always()
    needs:
      - preflight-tests
      - flight-tests
      - hotel-tests
      - attractions-tests
      - saved-trip-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download pytest reports and browser artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-report-*
          path: test-reports
      - name: Build and validate the 23-case report
        if: always()
        run: >-
          python scripts\ci_report.py
          --reports-dir test-reports
          --html test-reports\23-test-summary.html
          --markdown test-reports\23-test-summary.md
          --expected-count 23
      - name: Publish workbook results to the workflow summary
        if: always()
        shell: pwsh
        run: |
          $summaryPath = "test-reports\23-test-summary.md"
          if (Test-Path $summaryPath) {
            Get-Content $summaryPath | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "The 23-case summary could not be generated. See the combined CI artifact and job logs." | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload final 23-case HTML summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-23-case-summary
          path: |
            test-reports/23-test-summary.html
            test-reports/23-test-summary.md
          if-no-files-found: warn
          retention-days: 14
      - name: Upload combined CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-pytest-reports
          path: test-reports/
          if-no-files-found: warn
          retention-days: 14
