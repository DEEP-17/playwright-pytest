name: pytest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "test-results" | Out-Null
      - name: Run unit tests
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q
          tests/test_calendar_helper.py
          tests/test_support.py
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-unit-tests
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  session-state-tests:
    name: Browser session-state tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "test-results" | Out-Null
      - name: Run browser session-state tests
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_session_state.py
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-session-state
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  ui-test-cases:
    name: ${{ matrix.case }}
    runs-on: windows-latest
    environment: QA
    needs: [unit-tests, session-state-tests]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - case: Flight booking flow
            case_id: flight-booking
            test_path: tests/test_flight.py
            test_filter: test_flight_booking_flow
            authenticated: true
          - case: Hotel booking flow
            case_id: hotel-booking
            test_path: tests/test_hotel.py
            test_filter: test_hotel_booking_flow
            authenticated: true
          - case: Public attractions validation
            case_id: public-attractions
            test_path: tests/test_critical_flows.py
            test_filter: c10
            authenticated: false
          - case: Flight contact validation
            case_id: flight-contact-validation
            test_path: tests/test_critical_flows.py
            test_filter: "c7 and flight"
            authenticated: true
          - case: Flight no-seat checkout
            case_id: flight-no-seat-checkout
            test_path: tests/test_critical_flows.py
            test_filter: c5
            authenticated: true
          - case: Flight passenger validation
            case_id: flight-passenger-validation
            test_path: tests/test_critical_flows.py
            test_filter: c6
            authenticated: true
          - case: Flight price filter
            case_id: flight-price-filter
            test_path: tests/test_critical_flows.py
            test_filter: c13
            authenticated: true
          - case: Flight history navigation
            case_id: flight-history-navigation
            test_path: tests/test_critical_flows.py
            test_filter: c15
            authenticated: true
          - case: Flight combined filters
            case_id: flight-combined-filters
            test_path: tests/test_critical_flows.py
            test_filter: c21
            authenticated: true
          - case: Flight checkout refresh
            case_id: flight-checkout-refresh
            test_path: tests/test_critical_flows.py
            test_filter: c22
            authenticated: true
          - case: Hotel contact validation
            case_id: hotel-contact-validation
            test_path: tests/test_critical_flows.py
            test_filter: "c7 and hotel"
            authenticated: true
          - case: Hotel recovery state
            case_id: hotel-recovery-state
            test_path: tests/test_critical_flows.py
            test_filter: c8
            authenticated: true
          - case: Hotel guest age validation
            case_id: hotel-guest-age-validation
            test_path: tests/test_critical_flows.py
            test_filter: c9
            authenticated: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "test-results" | Out-Null
      - name: Validate required test configuration
        shell: pwsh
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          AUTHENTICATED: ${{ matrix.authenticated }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:BASE_URL)) {
            $missing += "BASE_URL"
          }
          if ($env:AUTHENTICATED -eq "true") {
            if ([string]::IsNullOrWhiteSpace($env:USER_EMAIL)) {
              $missing += "USER_EMAIL"
            }
            if ([string]::IsNullOrWhiteSpace($env:USER_PASSWORD)) {
              $missing += "USER_PASSWORD"
            }
          }
          if ($missing.Count -gt 0) {
            throw "Configure these GitHub Actions repository secrets: $($missing -join ', '). Secret values are never printed."
          }
      - name: Run selected test case
        id: run-tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q
          "${{ matrix.test_path }}"
          -k "${{ matrix.test_filter }}"
      - name: Verify authenticated session-state files
        if: ${{ always() && matrix.authenticated }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "test-results" | Out-Null
          $storageState = Test-Path ".auth\authenticated-state.json"
          $sessionStorage = Test-Path ".auth\authenticated-state.session-storage.json"
          [ordered]@{
            case = "${{ matrix.case }}"
            pytestOutcome = "${{ steps.run-tests.outcome }}"
            storageStateCreated = $storageState
            sessionStorageCreated = $sessionStorage
          } | ConvertTo-Json | Set-Content "test-results\session-state-evidence.json"
          if (
            "${{ steps.run-tests.outcome }}" -eq "success" -and
            (-not $storageState -or -not $sessionStorage)
          ) {
            throw "Authenticated storage-state files were not created."
          }
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.case_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  saved-trip-tests:
    name: Destructive saved-trip test
    runs-on: windows-latest
    environment: QA
    needs: ui-test-cases
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "test-results" | Out-Null
      - name: Validate required test configuration
        shell: pwsh
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:BASE_URL)) {
            $missing += "BASE_URL"
          }
          if ([string]::IsNullOrWhiteSpace($env:USER_EMAIL)) {
            $missing += "USER_EMAIL"
          }
          if ([string]::IsNullOrWhiteSpace($env:USER_PASSWORD)) {
            $missing += "USER_PASSWORD"
          }
          if ($missing.Count -gt 0) {
            throw "Configure these GitHub Actions repository secrets: $($missing -join ', '). Secret values are never printed."
          }
      - name: Run saved-trip test
        id: run-tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_trip.py
      - name: Verify authenticated session-state files
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "test-results" | Out-Null
          $storageState = Test-Path ".auth\authenticated-state.json"
          $sessionStorage = Test-Path ".auth\authenticated-state.session-storage.json"
          [ordered]@{
            job = "saved-trip-tests"
            pytestOutcome = "${{ steps.run-tests.outcome }}"
            storageStateCreated = $storageState
            sessionStorageCreated = $sessionStorage
          } | ConvertTo-Json | Set-Content "test-results\session-state-evidence.json"
          if (
            "${{ steps.run-tests.outcome }}" -eq "success" -and
            (-not $storageState -or -not $sessionStorage)
          ) {
            throw "Authenticated storage-state files were not created."
          }
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-saved-trip
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  test-reports:
    name: Collect CI test reports
    runs-on: windows-latest
    if: always()
    needs:
      - unit-tests
      - session-state-tests
      - ui-test-cases
      - saved-trip-tests
    steps:
      - name: Download pytest reports and browser artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-report-*
          path: test-reports
      - name: Upload combined CI reports
        uses: actions/upload-artifact@v4
        with:
          name: complete-pytest-reports
          path: test-reports/
          if-no-files-found: warn
          retention-days: 14
