name: pytest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  impact-analysis:
    name: Pull request impact analysis
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyze changed files
        run: >-
          python scripts/impactAnalysis.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.sha }}"
          --markdown test-results/impact-analysis.md
          --json test-results/impact-analysis.json
      - name: Publish impact analysis to the PR summary
        run: cat test-results/impact-analysis.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload impact analysis
        uses: actions/upload-artifact@v4
        with:
          name: pull-request-impact-analysis
          path: test-results/impact-analysis.*
          if-no-files-found: error
          retention-days: 14

  preflight-tests:
    name: Unit and browser session tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "test-results" | Out-Null
      - name: Run unit and browser session tests
        run: >-
          .\.venv\Scripts\python.exe -m pytest -vv -s
          --log-cli-level=DEBUG
          --log-file=test-results/pytest.log
          --log-file-level=DEBUG
          testCases/unitTests/testCalendarHelper.py
          testCases/unitTests/testSupport.py
          testCases/unitTests/testCIReport.py
          testCases/unitTests/testSessionState.py
          testCases/unitTests/testBrowserDiagnostics.py
          testCases/unitTests/testSkipCases.py
          testCases/unitTests/testImpactAnalysis.py
          testCases/unitTests/testLogging.py
          testCases/unitTests/testAllureReportViewer.py
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-preflight
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  flight-tests:
    name: Flight test cases
    runs-on: windows-latest
    needs: preflight-tests
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-ui-tests
        with:
          case-name: Flight scenarios
          case-id: flight-scenarios
          test-paths: testCases/e2eTests/testFlight.py testCases/e2eTests/testCriticalFlows.py
          test-filter: testE1 or testE5 or testE6 or testE7 or testE8 or testE9 or c5 or c6 or (c7 and flight) or c13 or c15 or c21 or c22
          authenticated: "true"
          base-url: ${{ secrets.BASE_URL }}
          user-email: ${{ secrets.USER_EMAIL }}
          user-password: ${{ secrets.USER_PASSWORD }}

  hotel-tests:
    name: Hotel test cases
    runs-on: windows-latest
    needs: preflight-tests
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-ui-tests
        with:
          case-name: Hotel scenarios
          case-id: hotel-scenarios
          test-paths: testCases/e2eTests/testHotel.py testCases/e2eTests/testCriticalFlows.py
          test-filter: testE2 or testE10 or (c7 and hotel) or c8 or c9
          authenticated: "true"
          base-url: ${{ secrets.BASE_URL }}
          user-email: ${{ secrets.USER_EMAIL }}
          user-password: ${{ secrets.USER_PASSWORD }}

  attractions-tests:
    name: Attractions test cases
    runs-on: windows-latest
    needs: preflight-tests
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-ui-tests
        with:
          case-name: Public attractions validation
          case-id: public-attractions
          test-paths: testCases/e2eTests/testCriticalFlows.py
          test-filter: testE4 or c10
          authenticated: "false"
          base-url: ${{ secrets.BASE_URL }}

  saved-trip-tests:
    name: Saved-trip scenarios E12-E14
    runs-on: windows-latest
    environment: QA
    needs: [flight-tests, hotel-tests, attractions-tests]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "test-results" | Out-Null
      - name: Validate required test configuration
        shell: pwsh
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:BASE_URL)) {
            $missing += "BASE_URL"
          }
          if ([string]::IsNullOrWhiteSpace($env:USER_EMAIL)) {
            $missing += "USER_EMAIL"
          }
          if ([string]::IsNullOrWhiteSpace($env:USER_PASSWORD)) {
            $missing += "USER_PASSWORD"
          }
          if ($missing.Count -gt 0) {
            throw "Configure these GitHub Actions repository secrets: $($missing -join ', '). Secret values are never printed."
          }
      - name: Run saved-trip scenarios
        id: run-tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: >-
          .\.venv\Scripts\python.exe -m pytest -vv -s
          --log-cli-level=DEBUG
          --log-file=test-results/pytest.log
          --log-file-level=DEBUG
          --junitxml=test-results/junit-saved-trip.xml
          testCases/e2eTests/testTrip.py
      - name: Verify authenticated session-state files
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "test-results" | Out-Null
          $storageState = Test-Path ".auth\authenticated-state.json"
          $sessionStorage = Test-Path ".auth\authenticated-state.session-storage.json"
          [ordered]@{
            job = "saved-trip-tests"
            pytestOutcome = "${{ steps.run-tests.outcome }}"
            storageStateCreated = $storageState
            sessionStorageCreated = $sessionStorage
          } | ConvertTo-Json | Set-Content "test-results\session-state-evidence.json"
          if (
            "${{ steps.run-tests.outcome }}" -eq "success" -and
            (-not $storageState -or -not $sessionStorage)
          ) {
            throw "Authenticated storage-state files were not created."
          }
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-saved-trip
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  test-reports:
    name: Collect CI test reports
    runs-on: windows-latest
    if: always()
    needs:
      - preflight-tests
      - flight-tests
      - hotel-tests
      - attractions-tests
      - saved-trip-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download pytest reports and browser artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-report-*
          path: test-reports
      - name: Aggregate Allure results
        id: aggregate-allure
        if: always()
        shell: pwsh
        run: |
          $target = Join-Path (Get-Location) "test-reports\allure-results"
          New-Item -ItemType Directory -Force $target | Out-Null
          $sourceFiles = Get-ChildItem "test-reports" -Recurse -File |
            Where-Object {
              $_.Directory.Name -eq "allure-results" -and
              $_.Directory.FullName -ne $target
            }
          foreach ($file in $sourceFiles) {
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          $hasResults = [bool]($sourceFiles | Where-Object { $_.Name -like "*-result.json" })
          "has-results=$($hasResults.ToString().ToLowerInvariant())" |
            Add-Content $env:GITHUB_OUTPUT
      - uses: actions/setup-java@v4
        if: ${{ always() && steps.aggregate-allure.outputs.has-results == 'true' }}
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Allure command line
        if: ${{ always() && steps.aggregate-allure.outputs.has-results == 'true' }}
        shell: pwsh
        run: |
          $version = "2.35.1"
          $archive = Join-Path $env:RUNNER_TEMP "allure-$version.zip"
          $destination = Join-Path $env:RUNNER_TEMP "allure-cli"
          Invoke-WebRequest `
            -Uri "https://github.com/allure-framework/allure2/releases/download/$version/allure-$version.zip" `
            -OutFile $archive
          $expectedHash = "3cb17dd207291fe120c99a0e59919a45de656debc416c2ab3a4a2e1aa997aa54"
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Allure CLI archive checksum verification failed."
          }
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          Join-Path $destination "allure-$version\bin" |
            Add-Content $env:GITHUB_PATH
      - name: Generate Allure HTML report
        if: ${{ always() && steps.aggregate-allure.outputs.has-results == 'true' }}
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\allure-cli\allure-2.35.1\bin\allure.bat" generate `
            "test-reports\allure-results" `
            --clean `
            -o "test-reports\allure-report"
          Copy-Item scripts\openAllureReport.py test-reports\allure-report\openAllureReport.py
          Copy-Item scripts\openAllureReport.bat test-reports\allure-report\OPEN_REPORT.bat
          Copy-Item scripts\allureReportInstructions.txt test-reports\allure-report\OPEN_REPORT.txt
          $reportIndex = Join-Path (Get-Location) "test-reports\allure-report\index.html"
          $summaryPath = Join-Path (Get-Location) "test-reports\allure-report\widgets\summary.json"
          if (-not (Test-Path $reportIndex) -or -not (Test-Path $summaryPath)) {
            throw "Allure report generation did not produce index.html and widgets/summary.json."
          }
          $summary = Get-Content $summaryPath -Raw | ConvertFrom-Json
          if ($summary.statistic.total -le 0) {
            throw "Allure report contains no test results."
          }
      - name: Upload Allure HTML report
        if: ${{ always() && steps.aggregate-allure.outputs.has-results == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: test-reports/allure-report/
          if-no-files-found: error
          retention-days: 14
      - name: Build and validate the 23-case report
        if: always()
        run: >-
          python scripts\ci_report.py
          --reports-dir test-reports
          --html test-reports\23-test-summary.html
          --markdown test-reports\23-test-summary.md
          --expected-count 23
      - name: Publish workbook results to the workflow summary
        if: always()
        shell: pwsh
        run: |
          $summaryPath = "test-reports\23-test-summary.md"
          if (Test-Path $summaryPath) {
            Get-Content $summaryPath | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "The 23-case summary could not be generated. See the combined CI artifact and job logs." | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload final 23-case HTML summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-23-case-summary
          path: |
            test-reports/23-test-summary.html
            test-reports/23-test-summary.md
          if-no-files-found: warn
          retention-days: 14
      - name: Upload combined CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-pytest-reports
          path: test-reports/
          if-no-files-found: warn
          retention-days: 14
