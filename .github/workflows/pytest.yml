name: pytest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "test-results" | Out-Null
      - name: Run unit tests
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q
          tests/test_calendar_helper.py
          tests/test_support.py
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-unit-tests
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  session-state-tests:
    name: Browser session-state tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "test-results" | Out-Null
      - name: Run browser session-state tests
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_session_state.py
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-session-state
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  ui-test-cases:
    name: ${{ matrix.case }}
    runs-on: windows-latest
    environment: QA
    needs: [unit-tests, session-state-tests]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - case: Flight scenarios
            case_id: flight-scenarios
            test_paths: tests/test_flight.py tests/test_critical_flows.py
            test_filter: "test_e1 or test_e5 or test_e6 or test_e7 or test_e8 or test_e9 or c5 or c6 or (c7 and flight) or c13 or c15 or c21 or c22"
            authenticated: true
          - case: Hotel scenarios
            case_id: hotel-scenarios
            test_paths: tests/test_hotel.py tests/test_critical_flows.py
            test_filter: "test_e2 or test_e10 or (c7 and hotel) or c8 or c9"
            authenticated: true
          - case: Public attractions validation
            case_id: public-attractions
            test_paths: tests/test_critical_flows.py
            test_filter: "test_e4 or c10"
            authenticated: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "test-results" | Out-Null
      - name: Validate required test configuration
        shell: pwsh
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          AUTHENTICATED: ${{ matrix.authenticated }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:BASE_URL)) {
            $missing += "BASE_URL"
          }
          if ($env:AUTHENTICATED -eq "true") {
            if ([string]::IsNullOrWhiteSpace($env:USER_EMAIL)) {
              $missing += "USER_EMAIL"
            }
            if ([string]::IsNullOrWhiteSpace($env:USER_PASSWORD)) {
              $missing += "USER_PASSWORD"
            }
          }
          if ($missing.Count -gt 0) {
            throw "Configure these GitHub Actions repository secrets: $($missing -join ', '). Secret values are never printed."
          }
      - name: Run selected test case
        id: run-tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q
          ${{ matrix.test_paths }}
          -k "${{ matrix.test_filter }}"
      - name: Verify authenticated session-state files
        if: ${{ always() && matrix.authenticated }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "test-results" | Out-Null
          $storageState = Test-Path ".auth\authenticated-state.json"
          $sessionStorage = Test-Path ".auth\authenticated-state.session-storage.json"
          [ordered]@{
            case = "${{ matrix.case }}"
            pytestOutcome = "${{ steps.run-tests.outcome }}"
            storageStateCreated = $storageState
            sessionStorageCreated = $sessionStorage
          } | ConvertTo-Json | Set-Content "test-results\session-state-evidence.json"
          if (
            "${{ steps.run-tests.outcome }}" -eq "success" -and
            (-not $storageState -or -not $sessionStorage)
          ) {
            throw "Authenticated storage-state files were not created."
          }
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.case_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  saved-trip-tests:
    name: Saved-trip scenarios E12-E14
    runs-on: windows-latest
    environment: QA
    needs: ui-test-cases
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "test-results" | Out-Null
      - name: Validate required test configuration
        shell: pwsh
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:BASE_URL)) {
            $missing += "BASE_URL"
          }
          if ([string]::IsNullOrWhiteSpace($env:USER_EMAIL)) {
            $missing += "USER_EMAIL"
          }
          if ([string]::IsNullOrWhiteSpace($env:USER_PASSWORD)) {
            $missing += "USER_PASSWORD"
          }
          if ($missing.Count -gt 0) {
            throw "Configure these GitHub Actions repository secrets: $($missing -join ', '). Secret values are never printed."
          }
      - name: Run saved-trip scenarios
        id: run-tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_trip.py
      - name: Verify authenticated session-state files
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "test-results" | Out-Null
          $storageState = Test-Path ".auth\authenticated-state.json"
          $sessionStorage = Test-Path ".auth\authenticated-state.session-storage.json"
          [ordered]@{
            job = "saved-trip-tests"
            pytestOutcome = "${{ steps.run-tests.outcome }}"
            storageStateCreated = $storageState
            sessionStorageCreated = $sessionStorage
          } | ConvertTo-Json | Set-Content "test-results\session-state-evidence.json"
          if (
            "${{ steps.run-tests.outcome }}" -eq "success" -and
            (-not $storageState -or -not $sessionStorage)
          ) {
            throw "Authenticated storage-state files were not created."
          }
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-saved-trip
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  test-reports:
    name: Collect CI test reports
    runs-on: windows-latest
    if: always()
    needs:
      - unit-tests
      - session-state-tests
      - ui-test-cases
      - saved-trip-tests
    steps:
      - name: Download pytest reports and browser artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-report-*
          path: test-reports
      - name: Upload combined CI reports
        uses: actions/upload-artifact@v4
        with:
          name: complete-pytest-reports
          path: test-reports/
          if-no-files-found: warn
          retention-days: 14
