name: pytest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codacy-analysis:
    name: Codacy code quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run Codacy analysis
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          format: sarif
          output: codacy-results.sarif
          max-allowed-issues: "2147483647"
          gh-code-scanning-compat: "true"
      - name: Publish Codacy findings to GitHub code scanning
        if: ${{ always() && hashFiles('codacy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: codacy-results.sarif
          category: codacy-analysis-cli
      - name: Upload Codacy SARIF report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codacy-sarif-report
          path: codacy-results.sarif
          if-no-files-found: warn
          retention-days: 14

  impact-analysis:
    name: Pull request impact analysis
    if: ${{ github.event_name == 'pull_request' }}
    outputs:
      flightTests: ${{ steps.analyze.outputs.flightTests }}
      hotelTests: ${{ steps.analyze.outputs.hotelTests }}
      attractionsTests: ${{ steps.analyze.outputs.attractionsTests }}
      savedTripTests: ${{ steps.analyze.outputs.savedTripTests }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Analyze changed files
        id: analyze
        run: >-
          python automationScripts/impactAnalysis.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.sha }}"
          --markdown testResults/impact-analysis.md
          --json testResults/impact-analysis.json
          --github-output "$GITHUB_OUTPUT"
      - name: Publish impact analysis to the PR summary
        run: cat testResults/impact-analysis.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload impact analysis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pull-request-impact-analysis
          path: testResults/impact-analysis.*
          if-no-files-found: error
          retention-days: 14

  preflight-tests:
    name: Unit and browser session tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/customActions/setupPlaywright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "testResults" | Out-Null
      - name: Run unit and browser session tests
        id: run-tests
        run: >-
          .\.venv\Scripts\python.exe -m pytest -vv -s
          --log-cli-level=DEBUG
          --log-file=testResults/pytest.log
          --log-file-level=DEBUG
          --junitxml=testResults/preflight-results.xml
          testCases/componentTests/testCalendarHelper.py
          testCases/componentTests/testSupport.py
          testCases/componentTests/testCiReport.py
          testCases/componentTests/testSessionState.py
          testCases/componentTests/testBrowserDiagnostics.py
          testCases/componentTests/testSkipCases.py
          testCases/componentTests/testImpactAnalysis.py
          testCases/componentTests/testLogging.py
          testCases/componentTests/testReportHooks.py
          testCases/componentTests/testHotelPage.py
          testCases/componentTests/testFlightTripSummaryPage.py
          testCases/componentTests/testTripPage.py
          testCases/componentTests/testAllureReportViewer.py
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-report-preflight
          path: testResults/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload preflight failure evidence
        if: always() && steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-failure-evidence-preflight
          path: |
            testResults/preflight-results.xml
            testResults/report.html
            testResults/pytest.log
            testResults/screenshots/
            testResults/playwrightArtifacts/
            testResults/allureResults/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove session state and local logs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ".authenticationState") {
            Remove-Item -LiteralPath ".authenticationState" -Recurse -Force
          }
          if (Test-Path "testResults\pytest.log") {
            Remove-Item -LiteralPath "testResults\pytest.log" -Force
          }

  flight-tests:
    name: Flight test cases
    runs-on: windows-latest
    needs: [preflight-tests, impact-analysis]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.impact-analysis.result != 'success' || needs.impact-analysis.outputs.flightTests == 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/customActions/runUiTests
        with:
          case-name: Flight scenarios
          case-id: flight-scenarios
          test-paths: testCases/endToEndTests/testFlight.py testCases/endToEndTests/testCriticalFlows.py
          test-filter: testE1 or testE5 or testE6 or testE7 or testE8 or testE9 or c5 or c6 or (c7 and flight) or c13 or c15 or c21 or c22
          authenticated: "true"
          base-url: ${{ secrets.BASE_URL }}
          user-email: ${{ secrets.USER_EMAIL }}
          user-password: ${{ secrets.USER_PASSWORD }}

  hotel-tests:
    name: Hotel test cases
    runs-on: windows-latest
    needs: [preflight-tests, impact-analysis]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.impact-analysis.result != 'success' || needs.impact-analysis.outputs.hotelTests == 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/customActions/runUiTests
        with:
          case-name: Hotel scenarios
          case-id: hotel-scenarios
          test-paths: testCases/endToEndTests/testHotel.py testCases/endToEndTests/testCriticalFlows.py
          test-filter: testE2 or testE10 or (c7 and hotel) or c8 or c9
          authenticated: "true"
          base-url: ${{ secrets.BASE_URL }}
          user-email: ${{ secrets.USER_EMAIL }}
          user-password: ${{ secrets.USER_PASSWORD }}

  attractions-tests:
    name: Attractions test cases
    runs-on: windows-latest
    needs: [preflight-tests, impact-analysis]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.impact-analysis.result != 'success' || needs.impact-analysis.outputs.attractionsTests == 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/customActions/runUiTests
        with:
          case-name: Public attractions validation
          case-id: public-attractions
          test-paths: testCases/endToEndTests/testCriticalFlows.py
          test-filter: testE4 or c10
          authenticated: "false"
          base-url: ${{ secrets.BASE_URL }}

  saved-trip-tests:
    name: Saved-trip scenarios E12-E14
    runs-on: windows-latest
    environment: QA
    needs: [flight-tests, hotel-tests, attractions-tests, impact-analysis]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.impact-analysis.result != 'success' || needs.impact-analysis.outputs.savedTripTests == 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/customActions/setupPlaywright
      - name: Ensure report directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "testResults" | Out-Null
      - name: Validate required test configuration
        shell: pwsh
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:BASE_URL)) {
            $missing += "BASE_URL"
          }
          if ([string]::IsNullOrWhiteSpace($env:USER_EMAIL)) {
            $missing += "USER_EMAIL"
          }
          if ([string]::IsNullOrWhiteSpace($env:USER_PASSWORD)) {
            $missing += "USER_PASSWORD"
          }
          if ($missing.Count -gt 0) {
            throw "Configure these GitHub Actions repository secrets: $($missing -join ', '). Secret values are never printed."
          }
      - name: Run saved-trip scenarios
        id: run-tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: >-
          .\.venv\Scripts\python.exe -m pytest -vv -s
          --log-cli-level=DEBUG
          --log-file=testResults/pytest.log
          --log-file-level=DEBUG
          --junitxml=testResults/junit-saved-trip.xml
          testCases/endToEndTests/testTrip.py
      - name: Verify authenticated session-state files
        if: always()
        shell: pwsh
        run: |
          $evidencePath = "testResults\session-state-evidence.json"
          if (-not (Test-Path $evidencePath)) {
            throw "Pytest did not create session-state evidence."
          }
          $evidence = Get-Content $evidencePath -Raw | ConvertFrom-Json
          $storageState = [bool]$evidence.storageStateCreated
          $sessionStorage = [bool]$evidence.sessionStorageCreated
          $stateCleaned = -not (Test-Path ".authenticationState")
          [ordered]@{
            job = "saved-trip-tests"
            pytestOutcome = "${{ steps.run-tests.outcome }}"
            storageStateCreated = $storageState
            sessionStorageCreated = $sessionStorage
            stateDirectoryCleaned = $stateCleaned
          } | ConvertTo-Json | Set-Content "testResults\session-state-evidence.json"
          if (
            "${{ steps.run-tests.outcome }}" -eq "success" -and
            (-not $storageState -or -not $sessionStorage -or -not $stateCleaned)
          ) {
            throw "Authenticated session state was not recorded and cleaned."
          }
      - name: Upload pytest report and browser artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-report-saved-trip
          path: testResults/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload saved-trip failure evidence
        if: always() && steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-failure-evidence-saved-trip
          path: |
            testResults/junit-saved-trip.xml
            testResults/report.html
            testResults/pytest.log
            testResults/screenshots/
            testResults/playwrightArtifacts/
            testResults/allureResults/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove session state and local logs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ".authenticationState") {
            Remove-Item -LiteralPath ".authenticationState" -Recurse -Force
          }
          if (Test-Path "testResults\pytest.log") {
            Remove-Item -LiteralPath "testResults\pytest.log" -Force
          }

  testReports:
    name: Collect CI test reports
    runs-on: windows-latest
    if: always()
    needs:
      - preflight-tests
      - flight-tests
      - hotel-tests
      - attractions-tests
      - saved-trip-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download pytest reports and browser artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pytest-report-*
          path: testReports
      - name: Extract skipped test cases
        if: always()
        shell: pwsh
        run: |
          python -m automationScripts.extractSkippedTests `
            --reports-dir testReports `
            --output-dir skipped-test-artifact
      - name: Upload skipped test-case artifact
        if: always() && hashFiles('skipped-test-artifact/junit-skipped-tests.xml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-skipped-cases
          path: |
            skipped-test-artifact/junit-skipped-tests.xml
            skipped-test-artifact/skipped-tests.html
            skipped-test-artifact/skipped-tests.md
          if-no-files-found: error
          retention-days: 14
      - name: Aggregate Allure results
        id: aggregate-allure
        if: always()
        shell: pwsh
        run: |
          $target = Join-Path (Get-Location) "testReports\allureResults"
          New-Item -ItemType Directory -Force $target | Out-Null
          $sourceFiles = Get-ChildItem "testReports" -Recurse -File |
            Where-Object {
              $_.Directory.Name -eq "allureResults" -and
              $_.Directory.FullName -ne $target
            }
          foreach ($file in $sourceFiles) {
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          $hasResults = [bool]($sourceFiles | Where-Object { $_.Name -like "*-result.json" })
          "has-results=$($hasResults.ToString().ToLowerInvariant())" |
            Add-Content $env:GITHUB_OUTPUT
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: ${{ always() && steps.aggregate-allure.outputs.has-results == 'true' }}
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Allure command line
        if: ${{ always() && steps.aggregate-allure.outputs.has-results == 'true' }}
        shell: pwsh
        run: |
          $version = "2.35.1"
          $archive = Join-Path $env:RUNNER_TEMP "allure-$version.zip"
          $destination = Join-Path $env:RUNNER_TEMP "allure-cli"
          Invoke-WebRequest `
            -Uri "https://github.com/allure-framework/allure2/releases/download/$version/allure-$version.zip" `
            -OutFile $archive
          $expectedHash = "3cb17dd207291fe120c99a0e59919a45de656debc416c2ab3a4a2e1aa997aa54"
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Allure CLI archive checksum verification failed."
          }
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          Join-Path $destination "allure-$version\bin" |
            Add-Content $env:GITHUB_PATH
      - name: Generate Allure HTML report
        if: ${{ always() && steps.aggregate-allure.outputs.has-results == 'true' }}
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\allure-cli\allure-2.35.1\bin\allure.bat" generate `
            "testReports\allureResults" `
            --clean `
            -o "testReports\allureReport"
          Copy-Item automationScripts\openAllureReport.py testReports\allureReport\openAllureReport.py
          Copy-Item automationScripts\openAllureReport.bat testReports\allureReport\OPEN_REPORT.bat
          Copy-Item automationScripts\allureReportInstructions.txt testReports\allureReport\OPEN_REPORT.txt
          python -m automationScripts.validateAllureReport testReports\allureReport
      - name: Upload Allure HTML report
        if: ${{ always() && steps.aggregate-allure.outputs.has-results == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allure-report
          path: testReports/allureReport/
          if-no-files-found: error
          retention-days: 14
      - name: Build and validate the CI test summary
        if: always()
        shell: pwsh
        run: |
          $arguments = @(
            "automationScripts\ciReport.py",
            "--reports-dir", "testReports",
            "--html", "testReports\23-test-summary.html",
            "--markdown", "testReports\23-test-summary.md",
            "--expected-count", "23"
          )
          if ("${{ github.event_name }}" -eq "pull_request") {
            $arguments += "--allow-partial"
          }
          python @arguments
      - name: Publish workbook results to the workflow summary
        if: always()
        shell: pwsh
        run: |
          $summaryPath = "testReports\23-test-summary.md"
          if (Test-Path $summaryPath) {
            Get-Content $summaryPath | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "The 23-case summary could not be generated. See the combined CI artifact and job logs." | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload final 23-case HTML summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-23-case-summary
          path: |
            testReports/23-test-summary.html
            testReports/23-test-summary.md
          if-no-files-found: warn
          retention-days: 14
      - name: Upload combined CI reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: complete-pytest-reports
          path: testReports/
          if-no-files-found: warn
          retention-days: 14